name: Android foundation validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p build-evidence
          printf '%s\n' "$ACTUAL_SHA" | tee build-evidence/source-commit.txt

      - name: Detect Android application source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/build.gradle.kts ]]; then
            echo "android_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_source=false" >> "$GITHUB_OUTPUT"
            echo "No Android application source exists at this revision; validating CI bootstrap only."
          fi

      - uses: actions/setup-java@v4
        if: steps.source.outputs.android_source == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outputs.android_source == 'true'
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        if: steps.source.outputs.android_source == 'true'
        run: gradle :app:testDebugUnitTest

      - name: Lint
        if: steps.source.outputs.android_source == 'true'
        run: gradle :app:lintDebug

      - name: Assemble development APK
        if: steps.source.outputs.android_source == 'true'
        run: gradle :app:assembleDebug

      - name: Verify development APK identity
        if: steps.source.outputs.android_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee build-evidence/app-debug.apk.sha256

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee build-evidence/app-debug.badging.txt

          grep -Fq "package: name='com.goreecloud.youtubeplayer.dev' versionCode='1' versionName='0.1.0-dev'" build-evidence/app-debug.badging.txt
          grep -Fq "application-label:'GoreeCloud YouTube Player Dev'" build-evidence/app-debug.badging.txt

          if grep -Fq "uses-permission: name='android.permission.INTERNET'" build-evidence/app-debug.badging.txt; then
            echo "Development APK unexpectedly requests INTERNET permission" >&2
            exit 1
          fi

      - name: Upload development build evidence
        if: steps.source.outputs.android_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-youtube-player-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-evidence/source-commit.txt
            build-evidence/app-debug.apk.sha256
            build-evidence/app-debug.badging.txt
          if-no-files-found: error
          retention-days: 14

  runtime-local-data:
    name: Android runtime local-data acceptance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact runtime source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p build-evidence
          printf '%s\n' "$ACTUAL_SHA" | tee build-evidence/runtime-source-commit.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name goreecloud-api36 \
            --package "system-images;android-36;google_apis;x86_64"

      - name: Start Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$ADB"
          test -x "$EMULATOR"

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

          nohup "$EMULATOR" \
            -avd goreecloud-api36 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > build-evidence/emulator.log 2>&1 &
          echo "$!" > build-evidence/emulator.pid

          "$ADB" wait-for-device
          BOOTED=""
          for _ in $(seq 1 180); do
            BOOTED="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$BOOTED" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"

          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82 || true

      - name: Run SQLite runtime acceptance tests
        run: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-youtube-player-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-evidence/runtime-source-commit.txt
            build-evidence/emulator.log
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
          retention-days: 14

      - name: Stop emulator
        if: always()
        shell: bash
        run: "$ANDROID_HOME/platform-tools/adb" emu kill || true
